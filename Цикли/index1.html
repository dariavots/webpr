<!DOCTYPE html>
<html lang="uk">
<head><meta charset="UTF-8"><title>Завдання 2</title></head>
<body>
<h2>2. Всі ступені числа a менших b</h2>
<label>a: <input id="a" type="number" value="0"></label>
<label>b: <input id="b" type="number" value="0"></label>
<button onclick="
  let a=+document.getElementById('a').value,
      b=+document.getElementById('b').value;
  let res='', p=a, i=1;
  while(p < b) {
    res += 'a^' + i + ' = ' + p + '\n';
    i++;
    p *= a;
  }
  document.getElementById('r').textContent = res || 'Немає ступенів менших b';
">Виконати</button>
<pre id="r"></pre>

</body></html>
