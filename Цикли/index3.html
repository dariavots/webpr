<!DOCTYPE html>
<html lang="uk">
<head><meta charset="UTF-8"><title>Завдання 6</title></head>
<body>
<h2>6. Острів Манхеттен</h2>
<p>Куплено 1726 року за $24 під 6% річних. Скільки грошей у <span id="curYear"></span><script>document.getElementById("curYear").textContent=new Date().getFullYear()</script> році?</p>
<button onclick="
  let sum = 24;
  let startYear = 1726;
  let curYear = new Date().getFullYear();
  let years = curYear - startYear;
  let result = sum * Math.pow(1.06, years);
  document.getElementById('r').textContent =
    'Років пройшло: ' + years + '\nСума: $' + result.toFixed(2);
">Виконати</button>
<pre id="r"></pre>

</body></html>
