<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>8а. a ∈ [4,6]</h2>
<label>a: <input id="a1" type="number" value="0"></label>
<button onclick="
  let a1=+document.getElementById('a1').value;
  document.getElementById('r1').textContent = 'a ∈ [4,6]: ' + ((a1>=4)&&(a1<=6));
">Виконати</button>
<div id="r1"></div>
<h2>8б. a ∈ [-2,3]</h2>
<label>a: <input id="a2" type="number" value="0"></label>
<button onclick="
  let a=+document.getElementById('a2').value;
  document.getElementById('r2').textContent = 'a ∈ [-2,3]: ' + ((a>=-2)&&(a<=3));
">Виконати</button>
<div id="r2"></div>
</body>
</html>
