<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><title>Завдання 23</title>
<link rel="stylesheet" href="style.css"></head><body>
<h2>23. x ∈ [-5;-4] ∩ (0;2] ∩ [3.2;7]</h2>
<label>x: <input id="x" type="number" value="-4.5" step="0.1"></label>
<button onclick="
  let x=+document.getElementById('x').value;
  let res = (x>=-5 && x<=-4) && (x>0 && x<=2) && (x>=3.2 && x<=7);
  document.getElementById('r').textContent = 'Умова виконується: ' + res;
">Виконати</button>
<div id="r" class="result"></div>
<div id="nav"></div>
<script src="nav.js"></script>
<script>renderNav('23')</script>
</body></html>
