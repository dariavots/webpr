<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><title>Завдання 20</title>
<link rel="stylesheet" href="style.css"></head><body>
<h2>20. Чи є рік високосним</h2>
<label>Рік: <input id="y" type="number" value="2026" style="width:120px"></label>
<button onclick="
  let y=+document.getElementById('y').value;
  let leap = (y%4===0 && y%100!==0) || (y%400===0);
  document.getElementById('r').textContent = y + (leap ? ' - високосний' : ' - не високосний');
">Виконати</button>
<div id="r" class="result"></div>
<div id="nav"></div>
<script src="nav.js"></script>
<script>renderNav('20')</script>
</body></html>
